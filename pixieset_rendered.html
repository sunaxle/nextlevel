            height: 40px;
            border-radius: 4px;
            margin: 0 8px 8px;
            padding-inline: 4px;

            --media-control-padding: 4px;
            --media-control-background: transparent;
            --media-control-hover-background: rgba(87, 87, 87, 1);
        }

        media-controller[breakpointsm] media-control-bar {
            margin: 0 20px 20px;
        }

        media-controller media-control-bar {
            display: none;
        }
        
        media-controller[mediahasplayed] media-control-bar {
           display: inline-flex;
        }

        media-control-bar media-play-button,
        media-control-bar media-pip-button,
        media-control-bar media-fullscreen-button,
        media-control-bar media-airplay-button,
        media-control-bar media-cast-button {
            border-radius: 4px;
            width: 32px;

            --media-control-hover-background: #575757;
            --media-icon-color: #FFFFFF;
        }

        media-controller[breakpointsm] media-control-bar media-play-button {
            margin-right: 20px;
        }

        media-control-bar media-fullscreen-button [slot="icon"]:before {
            content: "\f065";
        }

        /* TIME DISPLAY AND TIME RANGE */

        media-time-display {
            display: none;
        }

        media-controller[breakpointsm] media-time-display {
            display: block;
        }

        media-time-range {
            --media-range-track-height: 4px;
            --media-control-hover-background: transparent;
            
            --media-range-track-color: #FFFFF;
            --media-range-track-background: #575757;
            --media-time-range-buffered-color: #575757;
            
            --media-preview-thumbnail-border: 2px solid #000000CC;
            --media-preview-thumbnail-border-radius: 4px 4px 0 0;
            --media-preview-time-border-radius: 0 0 4px 4px;
            --media-preview-time-background: #000000CC;
            --media-preview-time-padding: 0;
            --media-preview-box-margin: 0;
            --media-preview-thumbnail-max-height: 88px;
        }

        media-controller[breakpointsm] media-time-range {
            --media-preview-thumbnail-max-height: initial;
        }

        media-time-range:hover {
            --media-range-track-height: 6px;
        }

        media-time-range::part(thumb) {
            display: none;
        }

        /* SETTINGS MENU */

        media-settings-menu {
            width: 240px;
            margin-bottom: 8px;
            margin-right: 20px;
            border-radius: 4px;
            padding: 4px 0;

            --media-secondary-color: rgba(0, 0, 0, 0.8);
        }

        media-settings-menu-button {
            display: none;
            border-radius: 4px;
            width: 32px;

            --media-control-hover-background: #575757;
        }

        media-controller[breakpointsm] media-settings-menu-button {
            display: block;
        }

        media-settings-menu-button [slot="icon"] {
            padding: 0 5px;
        }

        media-settings-menu-button [slot="icon"]:before {
            content: "\f013";
        }

        media-settings-menu-item {
            padding: 8px 20px;
        }

        /* Hide Quality menu option if Auto is the only option available */
        .quality-settings[submenusize='1'] {
            display: none;
        }

        media-playback-rate-menu,
        media-rendition-menu {
            padding-top: 10px;
        }

        media-rendition-menu::part(menu-item radio), 
        media-playback-rate-menu::part(menu-item radio) {
            gap: 4px;
        }       

        media-rendition-menu::part(button),
        media-playback-rate-menu::part(button) {
            padding-bottom: 8px;
        }

        media-rendition-menu::part(back indicator),
        media-playback-rate-menu::part(back indicator) {
            width: 24px;
        }

        media-rendition-menu::part(back indicator):hover,
        media-playback-rate-menu::part(back indicator):hover {
            background-color: #575757;
            border-radius: 2px;
        }

        media-rendition-menu::part(menu-item radio):hover,
        media-playback-rate-menu::part(menu-item radio):hover,
        media-settings-menu-item:hover {
            background-color: #575757;
        }

        /* PIP, CAST AND AIRPLAY BUTTONS */

        media-pip-button,
        media-cast-button,
        media-airplay-button {
            --media-button-icon-height: 16px;

            display: none;
            height: 32px;
        }

        media-controller[breakpointsm] media-pip-button,
        media-controller[breakpointsm] media-cast-button,
        media-controller[breakpointsm] media-airplay-button{
            display: flex;
        }

        media-controller[breakpointsm] media-pip-button[mediapipunavailable],
        media-controller[breakpointsm] media-cast-button[mediacastunavailable],
        media-controller[breakpointsm] media-airplay-button[mediaairplayunavailable] {
            display: none;
        }

        /* MUTE BUTTON AND VOLUME SLIDER */

        .media-volume-wrapper {
            position: relative;
        }

        media-mute-button {
            --media-font-size: 16px;

            width: 32px;
            border-radius: 4px;
        }

        media-mute-button[mediavolumelevel='off'] span:before {
            content: "\f2e2";
        }

        media-mute-button[mediavolumelevel='low'] span:before {
            content: "\f026";
        }

        media-mute-button[mediavolumelevel='medium'] span:before {
            content: "\f6a8";
        }

        media-mute-button[mediavolumelevel='high'] span:before {
            content: "\f028";
        }

        media-controller[breakpointsm] media-mute-button {
            margin-left: 16px;
        }

        media-controller[breakpointsm] media-volume-range[mediavolumeunavailable] {
            display: none;
        }

        media-volume-range {
            --media-range-padding: 12px 10px 12px 8px;
            --media-control-background: rgba(0, 0, 0, 0.8);
            --media-control-hover-background: rgba(0, 0, 0, 0.8);
            --media-range-track-background: rgba(87, 87, 87, 1);
            --media-range-thumb-width: 8px;
            --media-range-thumb-height: 8px;
            --media-range-padding-left: 10px;
            --media-range-padding-right: 10px;

            width: 80px;
            height: 32px;
            border-radius: 4px;
        }

        media-volume-range:hover {
            --media-range-track-height: 6px;
        }

        .media-volume-range-wrapper {
            display: none;
            transform: rotate(-90deg) translateY(50%);
            transform-origin: 0 0;
            position: absolute;
            left: 0;
            top: 8px;
            opacity: 0;
            visibility: hidden;
            border-left: 16px solid transparent;
        }

        media-controller[breakpointsm] .media-volume-range-wrapper {
            display: block;
        }

        media-mute-button:hover + .media-volume-range-wrapper,
        .media-volume-range-wrapper:hover,
        .media-volume-range-wrapper:focus,
        .media-volume-range-wrapper:focus-within {
            opacity: 1;
            visibility: visible;
        }

        [keyboardcontrol] .media-volume-range-wrapper,
        [keyboardcontrol] .media-volume-range-wrapper:focus-within,
        [keyboardcontrol] .media-volume-range-wrapper:focus-within media-volume-range {
            visibility: visible;
        }
    </style>
